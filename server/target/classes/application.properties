# Application
spring.application.name=book-goblin
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bookgoblin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Postgres1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OpenLibrary API
openlibrary.api.url=https://openlibrary.org
openlibrary.search.url=${openlibrary.api.url}/search.json
openlibrary.covers.url=https://covers.openlibrary.org/b

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080
